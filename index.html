<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.png">
<title>blewd</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--card:rgba(20,20,20,.6);--border:#222}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{height:100vh;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at top,#0a0a0a,#000);overflow:hidden}
body:before{content:"";position:fixed;width:700px;height:700px;background:#111;filter:blur(220px);opacity:.4;animation:pulse 8s infinite alternate;z-index:-1}
@keyframes pulse{to{transform:scale(1.25)}}
#bg{position:fixed;inset:0;background:center/cover;filter:blur(10px) brightness(.35);transform:scale(1.2);opacity:0;transition:.7s;z-index:-2}
#bg.active{opacity:1}
.card{width:380px;padding:40px;text-align:center;border-radius:25px;background:var(--card);backdrop-filter:blur(20px);box-shadow:0 0 40px rgba(255,255,255,.05)}
.avatar-wrap{position:relative;display:inline-block}
.avatar{width:110px;height:110px;border-radius:50%;border:3px solid var(--border)}
#status{position:absolute;right:8px;bottom:8px;width:18px;height:18px;border-radius:50%;border:3px solid #111}
h1{margin-top:15px;font-size:26px}
.bio{margin:4px 0 18px;opacity:.7;font-size:14px}
.buttons{display:flex;justify-content:center;gap:18px}
.btn,.music,.osu{transition:.25s}
.btn{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.05)}
.btn:hover,.osu:hover{transform:translateY(-4px);background:#111;box-shadow:0 0 20px rgba(255,255,255,.1)}
.btn svg{width:22px;height:22px;fill:#fff;opacity:.8}
.music,.osu{margin-top:16px;display:flex;gap:15px;align-items:center;padding:12px;border-radius:15px;background:rgba(255,255,255,.04)}
.music{display:none}
.music img,.osu img{width:80px;height:80px;border-radius:12px;object-fit:cover}
.info{flex:1;text-align:left;min-width:0}
.title,.artist{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title{font-size:14px;font-weight:600}
.artist{font-size:13px;opacity:.7}
.progress-bar{height:4px;margin-top:6px;background:#222;border-radius:10px;overflow:hidden}
#progress{height:100%;background:#fff;width:0}
.osu-link{text-decoration:none;color:inherit;display:block}
</style>
</head>
<body>

<div id="bg"></div>

<div class="card">
  <div class="avatar-wrap">
    <img id="avatar" class="avatar">
    <div id="status"></div>
  </div>

  <h1>blewd</h1>
  <p class="bio">can you understand me?</p>

  <div class="buttons">
    <a class="btn" href="https://instagram.com/chainbail" target="_blank">...</a>
    <a class="btn" href="https://twitter.com/tqrkeja" target="_blank">...</a>
    <a class="btn" href="https://github.com/estrito" target="_blank">...</a>
  </div>

  <div id="spotify" class="music">
    <img id="cover">
    <div class="info">
      <div id="title" class="title"></div>
      <div id="artist" class="artist"></div>
      <div class="progress-bar"><div id="progress"></div></div>
    </div>
  </div>

  <a class="osu-link" href="https://osu.ppy.sh/users/meguri" target="_blank">
    <div class="osu">
      <img src="https://a.ppy.sh/23598448">
      <div class="info">
        <div class="title">meguri</div>
        <div class="artist">osu! standard player</div>
      </div>
    </div>
  </a>
</div>

<script>
const USER_ID="265545151882067978";
const $=id=>document.getElementById(id);

const statusColors={online:"#43b581",idle:"#faa61a",dnd:"#f04747",offline:"#747f8d"};

async function update(){
 try{
  const {data}=await (await fetch(`https://api.lanyard.rest/v1/users/${USER_ID}`)).json();

  $("avatar").src=`https://cdn.discordapp.com/avatars/${USER_ID}/${data.discord_user.avatar}.webp?size=512`;
  $("status").style.background=statusColors[data.discord_status];

  if(!data.listening_to_spotify){
   $("spotify").style.display="none";
   $("bg").classList.remove("active");
   return;
  }

  const s=data.spotify;
  $("spotify").style.display="flex";
  $("cover").src=s.album_art_url;
  $("title").textContent=s.song;
  $("artist").textContent=`${s.artist} • ${s.album}`;
  $("bg").style.backgroundImage=`url(${s.album_art_url})`;
  $("bg").classList.add("active");

  const p=Math.max(0,Math.min(
   ((Date.now()-s.timestamps.start)/(s.timestamps.end-s.timestamps.start))*100,
   100
  ));

  $("progress").style.width=p+"%";
 }catch(e){console.error(e)}
}

update();
setInterval(update,10000);
</script>
</body>
</html>
